spring.application.name=ai-resume-analyzer
server.port=8080

# MySQL (database is created automatically if the user has permission)
spring.datasource.url=jdbc:mysql://localhost:3306/resume_analyzer?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Uploads (max 5 MB, PDF/DOCX)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Folders are relative to the backend/ directory (run the app from backend/)
app.data-dir=${DATA_DIR:../data}
app.upload-dir=${UPLOAD_DIR:../uploads}
